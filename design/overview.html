<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Orbit Studio — Design Overview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0b0e; font-family: "Segoe UI", sans-serif; padding: 18px; }
  .head { text-align: center; margin-bottom: 14px; color: #e8eaf0; }
  .head b { font-size: 15px; letter-spacing: .04em; }
  .head i { display: block; font-size: 10px; color: #8a92a5; font-style: normal; margin-top: 3px; letter-spacing: .06em; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 820px; margin: 0 auto; }
  .cell { background: #14161d; border: 1px solid #262a34; border-radius: 10px; padding: 8px; }
  .cell img { width: 100%; display: block; border-radius: 6px; }
  .cap { text-align: center; font-size: 10.5px; color: #aab0c0; letter-spacing: .08em; margin-top: 6px; font-weight: 600; }
  .cap small { display: block; color: #636a7c; font-weight: 400; margin-top: 2px; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="head">
  <b>Orbit Studio — Panel Design Concepts</b>
  <i>same layout · four light moods · 360 × 660 px CEP panel</i>
</div>
<div class="grid">
  <div class="cell"><img src="showcase-nebula.png" alt="Nebula"/><div class="cap">NEBULA <small>violet ⇄ cyan · deep space</small></div></div>
  <div class="cell"><img src="showcase-ember.png" alt="Ember"/><div class="cap">EMBER <small>warm orange ⇄ ember red</small></div></div>
  <div class="cell"><img src="showcase-ocean.png" alt="Ocean"/><div class="cap">OCEAN <small>icy cyan ⇄ royal blue</small></div></div>
  <div class="cell"><img src="showcase-rose.png" alt="Rose"/><div class="cap">ROSE <small>magenta ⇄ violet · candy glow</small></div></div>
</div>
</body>
</html>
