<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AE3DRIG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    @font-face {
      font-family: 'BrutalType';
      src: url('./BrutalType.woff') format('woff');
    }

    * { box-sizing: border-box; font-family: 'BrutalType', sans-serif; outline: none; }
    body {
      background: #1e1e1e;
      color: #eee;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #topbar {
      height: 32px;
      background: #0f0f0fdb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.133);
      flex-shrink: 0;
    }

    #topbar .left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #topbar img { height: 20px; }
    .branding { display: flex; flex-direction: column; line-height: 1.1; user-select: none;}
    .branding .gothlab { font-size: 9px; font-weight: 400; user-select: none;}
    .branding .ae3drig { font-size: 10px; color: #aaa; user-select: none; }

    #buttons {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #buttons::-webkit-scrollbar { width: 8px; }
    #buttons::-webkit-scrollbar-track { background: #1e1e1e; }
    #buttons::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }
    #buttons::-webkit-scrollbar-thumb:hover { background: #666; }

    .btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #2a2a2a;
      border: none;
      border-radius: 6px;
      color: #eee;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .btn:hover { background: #3a3a3a; }
    .btn img { width: 18px; height: 18px; filter: brightness(4) invert(1) opacity(0.85); }

    #cleanBtn {
      background: #550000cc;
      padding-right: 6px;
      padding-left: 6px;
      padding-bottom: 2px;
      padding-top: 2px;
    }
    #cleanBtn:hover { background: #770000; }

    #spinner {
      position: fixed;
      inset: 0;
      background: #1e1e1e;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    .spinner-ring {
      width: 32px;
      height: 32px;
      border: 3px solid #444;
      border-top: 3px solid #eee;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Info icon */
    .info {
      margin-left: auto;
      font-size: 12px;
      opacity: 0.5;
      cursor: default;
      transition: opacity 0.2s;
    }
    .info:hover { opacity: 1; }
  </style>

  <script src="CSInterface.js"></script>
  <script>
    var csInterface = new CSInterface();

    // Host functions live under AE3DRIG_* so they cannot collide with other
    // panels (After Effects runs every panel in one ExtendScript engine).
    // The extension path goes over as a JSON string: a folder with an
    // apostrophe in it (e.g. "Sonjoy's") used to break every button.
    function runJSX(fnName) {
      var path = csInterface.getSystemPath(SystemPath.EXTENSION);
      csInterface.evalScript("AE3DRIG_" + fnName + "(" + JSON.stringify(path) + ");", function (res) {
        if (res === "EvalScript error.") {
          alert("AE 3D Rig: the host script is not loaded. Restart After Effects, or reinstall the panel.");
        }
      });
      if (document.activeElement) document.activeElement.blur();
    }

    window.addEventListener('load', () => {
      const spinner = document.getElementById('spinner');
      spinner.style.opacity = '0';
      setTimeout(() => spinner.remove(), 300);
 // Handle Ctrl (Windows) or Cmd (macOS) + click on Shape Mask button
      const shapeBtn = document.getElementById('shapeBtn');
      shapeBtn.addEventListener('click', (e) => {
        if (e.ctrlKey || e.metaKey) runJSX('aE3D');
        else runJSX('E3D');
      });
    });
  </script>
</head>
<body>

  <div id="spinner"><div class="spinner-ring"></div></div>

  <div id="topbar">
    <div class="left">
      <img src="16.png" alt="logo">
      <div class="branding">
        <div class="gothlab">GothLab.</div>
        <div class="ae3drig">AE 3D RIG</div>
      </div>
    </div>
    <button id="cleanBtn" class="btn" onclick="runJSX('CLEAN')">
      <img src="./clean.svg" alt="Clean">
      <span>Clean</span>
    </button>
  </div>

  <div id="buttons">
    <button class="btn" onclick="runJSX('CAMERA')">
      <img src="./video-camera.svg" alt="Camera">
      <span>Camera Rig</span>
    </button>

    <button class="btn" onclick="runJSX('LIGHTRIG')">
      <img src="./ring.svg" alt="Light">
      <span>Light Rig</span>
    </button>

    <button class="btn" onclick="runJSX('FLOOR')">
      <img src="./tiles.svg" alt="Floor">
      <span>Floor</span>
    </button>

    <button class="btn" onclick="runJSX('E3DB')">
      <img src="./cube-1.svg" alt="E3D Boiler">
      <span>E3D Boilerplate</span>
    </button>

    <!-- Updated Shape Mask button -->
    <button class="btn" id="shapeBtn">
      <img src="./perspective.svg" alt="E3D Mask">
      <span>Shape Mask</span>
      <span class="info" title="Hold Ctrl (Windows) or ⌘ Command (Mac) and click to create mask layers for each group inside your shape (e.g. 3 groups = 3 layers)">ℹ️</span>
    </button>

    <button class="btn" onclick="runJSX('STACKER')">
      <img src="./stack2.svg" alt="Stacker">
      <span>Stacker</span>
    </button>
  </div>

</body>
</html>
